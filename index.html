<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>TaskFlow</title>
    </head>
    <body>
        <main class="container">
            <h1>TaskFlow</h1>
            <p>Your Personal Productivity Manager</p>
            <form id="task-form">
                <input 
                type="text"
                id="task-input"
                placeholder="whats the plan for today"
                required>

                <div class="date-picker-wrapper">
                  <button type="button" id="date-picker-button">
                    <span id="date-display">Select due date</span>
                    <span>📅</span>
                  </button>

                  <input type="date" id="due-date">
                </div>

                <button type="submit">Add Task</button>
            </form>

            <div id="task-filters">
                <label for="task-filter">Filter:</label>
                <select id="task-filter">
                  <option value="all">All Tasks</option>
                  <option value="active">Active Tasks</option>
                  <option value="completed">Completed Tasks</option>
                  <option value="high">High Priority Tasks</option>
                  <option value="medium">Medium Priority Tasks</option>
                  <option value="low">Low Priority Tasks</option>
                </select>

                <label for="sort-tasks">Sort by:</label>
                <select id="sort-tasks">
                  <option value="default">Default</option>
                  <option value="earliest">Due date: Earliest first</option>
                  <option value="latest">Due date: Latest first</option>
                </select>

            </div>

            <div id="task-search">
                <input
                  type="text"
                  id="search-input"
                  placeholder="Search tasks..."
                >
            </div>
            
            <ul id="task-list" class="task-list"></ul>
            <p id="empty-message"></p>
            <p id="task-count">0 tasks pending</p>
        </main>
            
        <script src="script.js"></script>
    </body>
</html>
